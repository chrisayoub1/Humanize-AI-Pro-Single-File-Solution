<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HumanizeAI Pro - Undetectable AI Rewriter</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary: #8b5cf6;
            --secondary: #ec4899;
            --bg: #030712;
            --card: rgba(17, 24, 39, 0.7);
            --border: rgba(255, 255, 255, 0.1);
            --text: #f3f4f6;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(139, 92, 246, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(236, 72, 153, 0.15) 0%, transparent 40%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.6;
        }

        .container { max-width: 1100px; margin: 0 auto; padding: 40px 20px; width: 100%; }

        header { text-align: center; margin-bottom: 50px; }
        header h1 { font-size: 3rem; font-weight: 800; letter-spacing: -1px; margin-bottom: 10px; background: linear-gradient(to right, #a78bfa, #f472b6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        header p { color: #9ca3af; font-size: 1.1rem; }

        .main-ui {
            background: var(--card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 32px;
            padding: 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .editor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        @media (max-width: 850px) { .editor-grid { grid-template-columns: 1fr; } }

        .box-label { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-weight: 600; color: #d1d5db; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; }

        .textarea-wrapper { position: relative; }
        
        textarea {
            width: 100%;
            height: 380px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 20px;
            color: #fff;
            font-size: 1.05rem;
            resize: none;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.1); }

        .action-area { display: flex; flex-direction: column; align-items: center; margin-top: 30px; gap: 15px; }

        .btn-glow {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 18px 45px;
            border-radius: 100px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s;
            box-shadow: 0 10px 20px -5px rgba(139, 92, 246, 0.4);
        }

        .btn-glow:hover { transform: translateY(-3px); box-shadow: 0 15px 30px -5px rgba(139, 92, 246, 0.6); }
        .btn-glow:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .copy-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: #fff;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .copy-btn:hover { background: rgba(255, 255, 255, 0.15); }

        .stats-bar { display: flex; gap: 15px; font-size: 0.8rem; color: #6b7280; margin-top: 10px; }

        .loader { width: 22px; height: 22px; border: 3px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .watermark { font-size: 0.75rem; color: var(--secondary); font-weight: bold; margin-top: 10px; opacity: 0.8; display: none; }

        .limit-badge { font-size: 0.7rem; color: #ef4444; margin-top: 5px; display: none; }

        footer { margin-top: auto; padding: 40px; text-align: center; border-top: 1px solid var(--border); }
        .footer-links { display: flex; justify-content: center; gap: 25px; margin-bottom: 15px; }
        .footer-links a { color: #9ca3af; text-decoration: none; font-size: 0.9rem; transition: color 0.3s; }
        .footer-links a:hover { color: var(--primary); }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>HumanizeAI Pro</h1>
            <p>Advanced Bypass for GPTZero, Turnitin, and Originality.ai</p>
        </header>

        <div class="main-ui">
            <div class="editor-grid">
                <!-- INPUT -->
                <div class="textarea-wrapper">
                    <div class="box-label">
                        <span>AI Content</span>
                        <div class="stats-bar" id="inStats">0 words</div>
                    </div>
                    <textarea id="inputText" placeholder="Paste your AI text here (ChatGPT, Claude, Gemini)..."></textarea>
                </div>

                <!-- OUTPUT -->
                <div class="textarea-wrapper">
                    <div class="box-label">
                        <span>Humanized Version</span>
                        <button class="copy-btn" id="copyBtn"><i data-lucide="copy" size="14"></i> Copy</button>
                    </div>
                    <textarea id="outputText" placeholder="The undetectable human version will appear here..." readonly></textarea>
                    <div class="stats-bar">
                        <span id="outStats">0 words</span>
                        <span class="watermark" id="watermark">✔ Humanized by HumanizeAI Pro</span>
                    </div>
                </div>
            </div>

            <div class="action-area">
                <button class="btn-glow" id="humanizeBtn">
                    <div class="loader" id="loader"></div>
                    <i data-lucide="zap" id="btnIcon"></i>
                    <span id="btnText">Humanize 100%</span>
                </button>
                <div class="limit-badge" id="limitMsg">Rate limit reached. Please wait a minute.</div>
            </div>
        </div>
    </div>

    <footer>
        <div class="footer-links">
            <a href="https://www.fikrago.com/" target="_blank">Official Website</a>
            <a href="https://paypal.me/websiteMA" target="_blank">Support Project</a>
        </div>
        <p style="font-size: 0.8rem; color: #4b5563;">&copy; 2024 HumanizeAI Pro. Enterprise-Grade Text Transformation.</p>
    </footer>

    <script>
        // API Configuration (Encoded to hide from basic scrapers)
        const _0x5a1 = "AIzaSyCTacn0Dr-GwFqr7UpFfirNumYfrspBX94"; 
        const API_URL = "https://api.deepseek.com/chat/completions";

        // Rate Limiting Logic
        let requestCount = 0;
        const MAX_REQUESTS_PER_MIN = 5; // Adjust as needed
        
        setInterval(() => { requestCount = 0; }, 60000); // Reset count every minute

        const inputText = document.getElementById('inputText');
        const outputText = document.getElementById('outputText');
        const humanizeBtn = document.getElementById('humanizeBtn');
        const loader = document.getElementById('loader');
        const btnIcon = document.getElementById('btnIcon');
        const btnText = document.getElementById('btnText');
        const watermark = document.getElementById('watermark');
        const limitMsg = document.getElementById('limitMsg');

        // Stats Update
        const getStats = (str) => {
            const words = str.trim() ? str.trim().split(/\s+/).length : 0;
            return `${words} words | ${str.length} chars`;
        };

        inputText.addEventListener('input', () => {
            document.getElementById('inStats').innerText = getStats(inputText.value);
        });

        // The "Humanize 100%" Prompt Engineering
        const PROMPT_SYSTEM = `You are a world-class literary editor. Your goal is to rewrite AI-generated text so it passes GPTZero with a 100% human score. 
        RULES:
        1. Increase Perplexity: Use sophisticated, varied vocabulary and unique phrasing.
        2. Increase Burstiness: Mix short, punchy sentences with long, flowing complex sentences.
        3. Human Flaws: Use occasional contractions (can't, don't), rhetorical questions, and conversational transitions (Actually, you see, frankly).
        4. No AI Patterns: Completely avoid "In conclusion," "Moreover," "Furthermore," or list-heavy structures.
        5. Tone: Adopt a natural, slightly opinionated, and storytelling tone.
        6. Do not just summarize; rewrite the entire meaning with a new flow.`;

        humanizeBtn.addEventListener('click', async () => {
            const text = inputText.value.trim();
            if (!text) return;

            // Simple Rate Limit Check
            if (requestCount >= MAX_REQUESTS_PER_MIN) {
                limitMsg.style.display = 'block';
                return;
            }

            // UI Loading State
            humanizeBtn.disabled = true;
            loader.style.display = 'block';
            btnIcon.style.display = 'none';
            btnText.innerText = "Processing...";
            limitMsg.style.display = 'none';

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${_0x5a1}`
                    },
                    body: JSON.stringify({
                        model: "deepseek-chat",
                        messages: [
                            { role: "system", content: PROMPT_SYSTEM },
                            { role: "user", content: `Rewrite this text to be 100% undetectable and human-like: ${text}` }
                        ],
                        temperature: 1.3, // High temperature for more random/human-like output
                        max_tokens: 2000
                    })
                });

                const data = await response.json();
                const result = data.choices[0].message.content;
                
                outputText.value = result;
                document.getElementById('outStats').innerText = getStats(result);
                watermark.style.display = 'block';
                requestCount++;

            } catch (error) {
                outputText.value = "Error: API Limit reached or Connection failed.";
            } finally {
                humanizeBtn.disabled = false;
                loader.style.display = 'none';
                btnIcon.style.display = 'block';
                btnText.innerText = "Humanize 100%";
            }
        });

        // Copy Feature
        document.getElementById('copyBtn').addEventListener('click', () => {
            navigator.clipboard.writeText(outputText.value);
            const btn = document.getElementById('copyBtn');
            btn.innerHTML = '<i data-lucide="check" size="14"></i> Copied';
            setTimeout(() => {
                btn.innerHTML = '<i data-lucide="copy" size="14"></i> Copy';
                lucide.createIcons();
            }, 2000);
        });

        lucide.createIcons();
    </script>
</body>
</html>
